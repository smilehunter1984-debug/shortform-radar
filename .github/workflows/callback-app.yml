name: 콜백문자 앱 빌드

on:
  push:
    paths:
      - "callback-app/**"
      - ".github/workflows/callback-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: callback-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk comma-callback.apk
      - uses: actions/upload-artifact@v4
        with:
          name: comma-callback-apk
          path: callback-app/comma-callback.apk
          retention-days: 30

name: 콜백문자 앱 빌드

on:
  push:
    paths:
      - "callback-app/**"
      - ".github/workflows/callback-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: callback-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위 테스트 + APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk comma-callback.apk
      - uses: actions/upload-artifact@v4
        with:
          name: comma-callback-apk
          path: callback-app/comma-callback.apk
          retention-days: 30
      # 고정 주소로 최신 APK 올리기:
      # https://github.com/<저장소>/releases/download/callback-app-latest/comma-callback.apk
      - name: 고정 주소에 최신 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callback-app-latest
          name: 콤마 콜백문자 앱 (최신)
          body: |
            폰에서 아래 comma-callback.apk 를 누르면 바로 받아집니다. 기존 앱 위에 덮어 설치하면 설정·이력은 그대로 유지됩니다.
            빌드 커밋: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: callback-app/comma-callback.apk

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 가상폰 가속(KVM) 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK 빌드
        working-directory: callback-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: 가상폰에서 통화·문자 시험
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: callback-app
          script: bash ci/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: callback-app/emulator-results
          retention-days: 14
